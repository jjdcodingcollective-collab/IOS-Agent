[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ios-agent"
version = "0.1.0"
description = "Convert web codebases to Capacitor-based iOS apps with App Store compliance scaffolding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "jjdcodingcollective", email = "jjd.codingcollective@gmail.com" },
]
keywords = ["ios", "swift", "capacitor", "app-store", "compliance", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
# No third-party runtime deps — stdlib only by design (no PyYAML, no jsonschema).
dependencies = []

[project.scripts]
ios-agent = "wrapper.__main__:main"

[project.urls]
Repository = "https://github.com/jjdcodingcollective/ios-agent"
"Bug Tracker" = "https://github.com/jjdcodingcollective/ios-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wrapper*", "converter*"]

[tool.setuptools.package-data]
"*" = [
    "config/*.yaml",
    "config/*.json",
    "schemas/*.json",
    "templates/*.tmpl",
    "templates/*.storyboard",
    "templates/Assets.xcassets/**",
]
